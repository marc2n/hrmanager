spring:
  datasource:
    url: jdbc:h2:mem:hrdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

  docker:
    compose:
      enabled: false

management:
  tracing:
    export:
      otlp:
        enabled: false

  logging:
    export:
      otlp:
        enabled: false

  otlp:
    metrics:
      export:
        enabled: false

app:
  init-db: false