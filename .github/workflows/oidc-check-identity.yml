name: Verify Azure OIDC access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.target }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        target: [dev-infra, dev-app]

    environment:
      name: ${{ matrix.target }}

    permissions:
      contents: read
      id-token: write

    env:
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      TF_STATE_STORAGE_ACCOUNT: ${{ secrets.TF_STATE_STORAGE_ACCOUNT }}

    steps:
      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify application resource group access
        shell: bash
        run: |
          set -euo pipefail

          az group show \
            --name "$AZURE_RESOURCE_GROUP" \
            --query "{Name:name,Location:location}" \
            --output table

      - name: Verify infrastructure state container access
        if: matrix.target == 'dev-infra'
        shell: bash
        run: |
          set -euo pipefail

          az storage blob list \
            --account-name "$TF_STATE_STORAGE_ACCOUNT" \
            --container-name tfstate \
            --auth-mode login \
            --query "[].name" \
            --output json