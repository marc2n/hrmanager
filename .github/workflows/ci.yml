name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish and deploy the verified image to dev"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  JAVA_VERSION: '21'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run tests
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: warn

  dependency-analysis:
    needs: test
    name: Dependency analysis (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

  build:
    needs: dependency-analysis
    name: Build & Docker Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: hrmanager:latest
          platforms: linux/amd64

      - name: Run Trivy vulnerability scanner on Docker Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'hrmanager:latest'
          scan-type: 'image'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      - name: Export verified Docker image
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish
        shell: bash
        run: docker save --output "$RUNNER_TEMP/hr-app.tar" hrmanager:latest

      - name: Upload verified Docker image
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: hr-app-image
          path: ${{ runner.temp }}/hr-app.tar
          retention-days: 1
          compression-level: 0
          overwrite: true
          if-no-files-found: error

  publish:
    name: Publish verified image to ACR
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: dev-app

    permissions:
      contents: read
      id-token: write

    env:
      ACR_NAME: ${{ secrets.ACR_NAME }}
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
      IMAGE_REPOSITORY: hr-app
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

    outputs:
      image_reference: ${{ steps.image.outputs.image_reference }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Check registry variables
        run: |
          set -euo pipefail
          : "${ACR_NAME:?Set ACR_NAME in dev-app variables}"
          : "${ACR_LOGIN_SERVER:?Set ACR_LOGIN_SERVER in dev-app variables}"

      - name: Download verified Docker image
        uses: actions/download-artifact@v5
        with:
          name: hr-app-image
          path: ${{ runner.temp }}

      - name: Load and tag image
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/hr-app.tar"
          docker tag hrmanager:latest \
            "$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:$IMAGE_TAG"

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to container registry
        run: az acr login --name "$ACR_NAME"

      - name: Push verified image
        run: docker push "$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:$IMAGE_TAG"

      - name: Record published image
        id: image
        run: |
          set -euo pipefail

          IMAGE_DIGEST=$(az acr repository show \
            --name "$ACR_NAME" \
            --image "$IMAGE_REPOSITORY:$IMAGE_TAG" \
            --query digest \
            --output tsv)

          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

          IMAGE_REFERENCE="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY@$IMAGE_DIGEST"

          echo "image_reference=$IMAGE_REFERENCE" >> "$GITHUB_OUTPUT"

          {
            echo "### Published application image"
            echo ""
            echo "- Tag: $IMAGE_TAG"
            echo "- Deployment reference: $IMAGE_REFERENCE"
            echo "- Source commit: $GITHUB_SHA"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy and verify application
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 40

    environment:
      name: dev-app

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: terraform-dev
      cancel-in-progress: false

    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
      IMAGE_REFERENCE: ${{ needs.publish.outputs.image_reference }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Check deployment variables
        run: |
          set -euo pipefail
          : "${AZURE_RESOURCE_GROUP:?Set AZURE_RESOURCE_GROUP}"
          : "${CONTAINER_APP_NAME:?Set CONTAINER_APP_NAME in dev-app}"
          : "${IMAGE_REFERENCE:?Published image reference is missing}"

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy published image
        id: deployment
        run: |
          set -euo pipefail

          REVISION=$(az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --container-name hr-app \
            --image "$IMAGE_REFERENCE" \
            --query properties.latestRevisionName \
            --output tsv)

          test -n "$REVISION"

          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "Target revision: $REVISION"

      - name: Verify revision and application readiness
        env:
          TARGET_REVISION: ${{ steps.deployment.outputs.revision }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            REVISION_JSON=$(az containerapp revision show \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --revision "$TARGET_REVISION" \
              --output json)

            ACTUAL_IMAGE=$(jq -r \
              '.properties.template.containers[] | select(.name == "hr-app") | .image' \
              <<< "$REVISION_JSON")

            HEALTH=$(jq -r '.properties.healthState' <<< "$REVISION_JSON")
            PROVISIONING=$(jq -r '.properties.provisioningState' <<< "$REVISION_JSON")

            if [[ "$ACTUAL_IMAGE" != "$IMAGE_REFERENCE" ]]; then
              echo "::error::Revision image does not match the published digest."
              exit 1
            fi

            if [[ "$PROVISIONING" == "Failed" ]]; then
              echo "::error::Revision provisioning failed."
              exit 1
            fi

            APP_JSON=$(az containerapp show \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --output json)

            READY_REVISION=$(jq -r \
              '.properties.latestReadyRevisionName' <<< "$APP_JSON")

            HOSTNAME=$(jq -r \
              '.properties.configuration.ingress.fqdn' <<< "$APP_JSON")

            echo "Attempt $attempt: revision=$TARGET_REVISION health=$HEALTH ready=$READY_REVISION"

            if [[ "$HEALTH" == "Healthy" && "$READY_REVISION" == "$TARGET_REVISION" ]]; then
              if curl --fail --silent --show-error --max-time 15 \
                "https://$HOSTNAME/actuator/health/readiness" \
                | jq -e '.status == "UP"' > /dev/null; then
                {
                  echo "### Application deployment verified"
                  echo ""
                  echo "- Revision: $TARGET_REVISION"
                  echo "- Image: $IMAGE_REFERENCE"
                  echo "- URL: https://$HOSTNAME"
                  echo "- Readiness: UP"
                } | tee -a "$GITHUB_STEP_SUMMARY"

                exit 0
              fi
            fi

            sleep 15
          done

          echo "::error::The target revision did not become healthy within the verification window."
          exit 1