name: Inspect GitHub OIDC claims

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target: [dev-infra, dev-app]

    environment:
      name: ${{ matrix.target }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Display trust identifiers
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken(
              'api://AzureADTokenExchange'
            );

            const claims = JSON.parse(
              Buffer.from(
                token.split('.')[1],
                'base64url'
              ).toString('utf8')
            );

            core.info(`issuer: ${claims.iss}`);
            core.info(`audience: ${claims.aud}`);
            core.info(`subject: ${claims.sub}`);